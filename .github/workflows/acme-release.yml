# Path toward production (MOCKED deploy). Build and pack are real; the publish step is an echo, gated by DevOps approval.
name: Acme Release (mock deploy)
on:
  push:
    branches: [main]
    paths: ['packages/**', '.changeset/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.pkg.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - id: pkg
        run: |
          PKG=$(git diff --name-only HEAD~1 HEAD | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | head -1)
          [ -n "$PKG" ] && echo "npm=$(node -p "require('./packages/$PKG/package.json').name")" >> "$GITHUB_OUTPUT" || true
      - if: steps.pkg.outputs.npm != ''
        run: pnpm exec turbo build --filter="${{ steps.pkg.outputs.npm }}..." && pnpm --filter "${{ steps.pkg.outputs.npm }}" pack --pack-destination ./dist-pack
      - if: steps.pkg.outputs.npm != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: dist-pack/*.tgz
  deploy-staging:
    needs: build
    if: needs.build.outputs.npm != ''
    runs-on: ubuntu-latest
    environment: staging   # required reviewer = DevOps (human approval in GitHub)
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
      - run: |
          echo "MOCK DEPLOY: would publish $(ls *.tgz) to Acme's internal registry (staging)."
          echo "Mocked on purpose: no real registry in this exercise." >> "$GITHUB_STEP_SUMMARY"
