# Launch a Cursor Cloud Agent when an allowlisted approver labels an Acme task issue acme:approved (starter draft).
# issues events run the workflow file from the default branch, so PR code can never change this logic.
name: Acme Launch Agent
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: acme-launch-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  launch:
    # sender is the trusted event actor; labels added by bots (sender.type Bot) never launch an agent.
    if: github.event.label.name == 'acme:approved' && github.event.sender.type == 'User' && contains(github.event.issue.labels.*.name, 'acme:task')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: agent-launch # holds CURSOR_API_KEY; restrict the environment to the main branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/acme
            tools/acme
      - name: Approver allowlist
        env:
          ACTOR: ${{ github.event.sender.login }}
        run: grep -qx "  - $ACTOR" .github/acme/approvers.yml || { echo "::error::$ACTOR may not approve agent runs"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Launch Cloud Agent (Cursor API)
        id: launch
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          AGENT=$(node tools/acme/cursor-agent.mjs launch --issue "$N")
          case "$AGENT" in bc-*) ;; *) echo "::error::Launch did not return an agent id (got: $AGENT)"; exit 1;; esac
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
      - name: Wait for the run and report back
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          node tools/acme/cursor-agent.mjs wait --agent "${{ steps.launch.outputs.agent }}" --timeout-min 40 > result.json
          CODE=$?
          USAGE=$(node tools/acme/cursor-agent.mjs usage --agent "${{ steps.launch.outputs.agent }}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).totalUsage.totalTokens)}catch{console.log("n/a")}})')
          PR=$(node -p "require('./result.json').prUrl || ''")
          if [ $CODE -eq 0 ]; then
            gh issue comment "$N" --repo "$REPO" --body "Agent finished. PR: ${PR:-none}. Tokens: $USAGE. Next: CI guardrails, then QA sign-off."
            gh issue edit "$N" --repo "$REPO" --remove-label acme:agent-running --add-label acme:pr-open
          else
            gh issue comment "$N" --repo "$REPO" --body "Agent did not finish cleanly ($(node -p "require('./result.json').runStatus")). A human needs to look: see the agent link above."
            gh issue edit "$N" --repo "$REPO" --remove-label acme:agent-running --add-label acme:needs-human
            exit 1
          fi
      - name: Launch failed, hand to a human
        if: failure() && steps.launch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$N" --repo "$REPO" --body "Cloud Agent launch failed. Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$N" --repo "$REPO" --add-label acme:needs-human
